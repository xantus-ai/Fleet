services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: postgres
      # No password: matches the default DATABASE_URL in .env.example.
      # Safe because we only expose the port on 127.0.0.1 below.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fleet-postgres:
